name: Rate projects

on:
  repository_dispatch:
    types: [project-push]
  schedule:
    - cron: '7 5 * * *'
  workflow_dispatch:

concurrency:
  group: rate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Wait briefly so pushes that arrive together are rated together
        if: github.event_name == 'repository_dispatch'
        run: sleep 45

      - name: Collect evidence from GitHub
        env:
          GH_READ_TOKEN: ${{ secrets.CC_READ_TOKEN }}
          CC_REPO: ${{ github.repository }}
        run: node collect.mjs

      - name: Keep the previous state
        run: if [ -f state.json ]; then cp state.json work/prev-state.json; fi

      - name: Rate with Claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          npm install -g @anthropic-ai/claude-code
          claude -p "Follow the instructions in RATER.md exactly. Today is $(TZ=Europe/Zurich date +%Y-%m-%d)." --allowedTools "Read,Write,Edit,Glob" --permission-mode acceptEdits --max-turns 150

      - name: Check and finish the state
        run: node finalize.mjs

      - name: Publish
        run: |
          git config user.name "commandcenter-bot"
          git config user.email "commandcenter-bot@users.noreply.github.com"
          git add state.json lines
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -m "Update state $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs -q && git push -q && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1
