<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commandcenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;700;800&family=Overpass+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#101f44;overflow:hidden}
::selection{background:#f4c430;color:#101f44}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#101f44;color:#fff;font-family:Overpass,sans-serif;overflow:hidden;transition:filter 2s}
#stage.night{filter:brightness(.55) saturate(.85)}
.abs{position:absolute}
@keyframes run{0%{transform:translateX(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateX(var(--len));opacity:0}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 0 0 12px rgba(255,255,255,0)}}
@keyframes flap{0%,94%{transform:scaleY(1)}96%{transform:scaleY(.08)}98%,100%{transform:scaleY(1)}}
@keyframes drain{from{width:100%}to{width:0}}
.pulse{animation:run 2.6s cubic-bezier(.2,.7,.3,1) infinite}
.ringy{animation:ring 1.8s ease-out infinite}
.flap{display:inline-block;transform-origin:50% 50%;animation:flap 9s ease-in-out infinite}
.drain{animation:drain 20s linear both}
@keyframes trainIn{from{transform:translateX(var(--from))}to{transform:translateX(0)}}
@keyframes signIn{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes arriveRing{0%{box-shadow:0 0 0 0 rgba(16,31,68,.5)}100%{box-shadow:0 0 0 26px rgba(16,31,68,0)}}
.arrive-train{animation:trainIn 2.8s cubic-bezier(.16,1,.3,1) both}
.arrive-sign{animation:signIn .9s cubic-bezier(.16,1,.3,1) .4s both}
.arrive-ring{animation:arriveRing 1.6s ease-out 2.4s 4}
@media (prefers-reduced-motion: reduce){.pulse,.ringy,.flap,.drain,.arrive-train,.arrive-sign,.arrive-ring,.nowdot{animation:none}}
.mono{font-family:'Overpass Mono',monospace}
.row>*:not(.abs){position:relative;z-index:1}
#arrival{position:absolute;inset:0;display:none;color:#101f44;font-family:Overpass,sans-serif;z-index:50}
#arrival.on{display:block}
#detail{position:absolute;inset:0;background:#101f44;z-index:40;opacity:0;visibility:hidden;transition:opacity .8s,visibility 0s .8s}
#detail.on{opacity:1;visibility:visible;transition:opacity .8s}
.hit{position:absolute;left:24px;right:24px;z-index:20;cursor:pointer;border-radius:12px;transition:background .2s}
.hit:hover{background:rgba(255,255,255,.045)}
[data-line].row{cursor:pointer}
.navbtn{display:flex;align-items:center;justify-content:center;height:56px;min-width:56px;padding:0 20px;border-radius:28px;border:2px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fff;font:800 22px Overpass,sans-serif;cursor:pointer}
.navbtn:hover{background:rgba(255,255,255,.14)}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
@keyframes nowDot{0%{box-shadow:0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:0 0 0 10px rgba(255,255,255,0)}}
.nowdot{animation:nowDot 1.8s ease-out infinite}
@media (prefers-reduced-motion: reduce){.nowdot{animation:none}}
</style>
</head>
<body>
<div id="stage">
<header class="abs" style="left:48px;top:40px;right:48px;height:96px;display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:36px">
<div style="background:#1a3170;border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)">
<div style="border:2px solid #fff;border-radius:8px;padding:10px 28px 8px"><span style="font-size:48px;font-weight:800;letter-spacing:-.5px;line-height:1">Commandcenter</span></div>
</div>
<p id="headline" style="margin:0;font-size:32px;font-weight:600;line-height:1.25;max-width:760px"></p>
</div>
<div style="display:flex;align-items:center;gap:40px">
<div style="display:flex;flex-direction:column;gap:7px;font-size:16px;color:#c9d4ee">
<span style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:12px;border-radius:6px;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.25)"></span>AI agent working</span>
<span style="display:flex;align-items:center;gap:10px"><span style="width:26px;height:8px;background:#fff;box-shadow:0 0 10px 2px #f4c430"></span>Moved today</span>
<span style="display:flex;align-items:center;gap:10px"><span style="width:14px;height:14px;border-radius:7px;background:#ff4d4d;border:3px solid #fff;box-sizing:border-box;margin:0 6px"></span>Held</span>
<span style="display:flex;align-items:center;gap:10px"><span style="font-size:13px;font-weight:800;color:#101f44;background:#ffb347;border-radius:9px;padding:2px 8px 0">1</span>Needs you</span>
</div>
<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px">
<span id="date" style="font-size:16px;font-weight:700;letter-spacing:1px;color:#c9d4ee"></span>
<span id="clock" class="mono" style="font-size:48px;font-weight:600;line-height:1"></span>
<span id="fresh" class="mono" style="font-size:13px;color:#a9b8d8"></span>
</div>
</div>
</header>
<div id="map" role="group" aria-label="Network map: each project is a rail line, stations are milestones, trains are AI agents at work"></div>
<div id="lower"></div>
<div id="detail"></div>
<div id="arrival"></div>
</div>

<script>
(() => {
const Q = new URLSearchParams(location.search);
const KEY = Q.get('key') || '';
const PREVIEW = Q.get('preview');
const G = '#101f44';
const X0 = 330, X1 = 1540;
const RUN_MS = 30 * 60 * 1000;
const stage = document.getElementById('stage');
let state = null, shown = {}, arrivalTimer = null;

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = iso => {
  if (!iso) return '';
  const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000));
  if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60);
  if (h < 48) return h + ' h ago';
  return Math.round(h / 24) + ' days ago';
};
const daysSince = d => d ? Math.max(0, Math.round((Date.now() - Date.parse(d)) / 86400000)) : 0;

function fit() {
  const s = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px,${(innerHeight - 1080 * s) / 2}px) scale(${s})`;
}
addEventListener('resize', fit); fit();

function tick() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich' });
  document.getElementById('date').textContent = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Europe/Zurich' }).toUpperCase();
  const hour = Number(now.toLocaleString('en-GB', { hour: '2-digit', hour12: false, timeZone: 'Europe/Zurich' }));
  stage.classList.toggle('night', Q.get('night') === '1' || (Q.get('night') !== '0' && (hour >= 22 || hour < 7)));
}
setInterval(tick, 10000); tick();

function render() {
  if (!state) return;
  document.getElementById('headline').innerHTML = esc(state.headline);
  document.getElementById('fresh').textContent = state.updatedAt ? 'updated ' + ago(state.updatedAt) : '';
  const lines = state.lines || [];
  const groupOf = l => l.state === 'moving' ? 0 : (l.state === 'held' ? 1 : 2);
  const groups = new Set(lines.map(groupOf)).size;
  const gap = lines.length > 1 ? Math.min(lines.length <= 4 ? 120 : 68, (540 - (groups - 1) * 18) / (lines.length - 1)) : 0;
  let html = '', extra = 0, lastGroup = null;
  lines.forEach((l, i) => {
    const g = groupOf(l);
    if (lastGroup !== null && g !== lastGroup) extra += 18;
    lastGroup = g;
    const y = Math.round(206 + i * gap + extra);
    html += lineHtml(l, i, y);
    const hh = Math.max(56, Math.min(gap || 120, 120));
    if (Array.isArray(l.steps)) html += `<div class="hit" data-line="${esc(l.id)}" role="button" tabindex="0" aria-label="Open ${esc(l.name)}" style="top:${Math.round(y - hh / 2)}px;height:${hh}px"></div>`;
  });
  if (!lines.length) html = `<p class="abs" style="left:330px;top:300px;font-size:32px;color:#a9b8d8">No project lines yet. The first rating fills this map.</p>`;
  document.getElementById('map').innerHTML = html;
  document.getElementById('lower').innerHTML = lowerHtml(lines);
}

function lineHtml(l, i, y) {
  const n = l.stations.length;
  const xs = l.stations.map((_, k) => X0 + (n > 1 ? k / (n - 1) : 0) * (X1 - X0));
  const posX = (at, p) => at >= n - 1 ? xs[n - 1] : xs[at] + p * (xs[at + 1] - xs[at]);
  const tX = posX(l.at, l.progress);
  const tf = l.todayFrom || { at: l.at, progress: l.progress };
  const fromX = Math.min(posX(tf.at, tf.progress), tX);
  const running = l.state === 'moving' && l.lastPush && (Date.now() - Date.parse(l.lastPush) < RUN_MS);
  const held = l.state === 'held', parked = l.state === 'parked';
  const c = l.color, fut = c + '45';
  let h = '';
  h += `<div class="abs" style="left:64px;top:${y - 20}px;width:250px;display:flex;justify-content:flex-end"><span style="position:relative;background:${c};color:${G};font-size:20px;font-weight:800;padding:7px 15px 4px;border-radius:8px;white-space:nowrap;display:flex;align-items:center;gap:10px"><span style="width:24px;height:24px;border-radius:12px;background:${G};color:${c};font-size:15px;display:flex;align-items:center;justify-content:center;margin-top:-3px">${i + 1}</span>${esc(l.name)}${Array.isArray(l.needs) && l.needs.length ? `<span style="position:absolute;right:-12px;top:-12px;min-width:26px;height:26px;padding:0 6px;box-sizing:border-box;border-radius:13px;background:${AMBER};color:${G};border:3px solid ${G};font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center">${l.needs.length}</span>` : ''}</span></div>`;
  h += `<div class="abs" style="left:${X0}px;top:${y - 6}px;width:${Math.round(tX - X0)}px;height:12px;border-radius:6px 0 0 6px;background:${c}"></div>`;
  h += `<div class="abs" style="left:${Math.round(tX)}px;top:${y - 6}px;width:${Math.round(X1 - tX)}px;height:12px;border-radius:0 6px 6px 0;background:${fut}"></div>`;
  if (tX - fromX > 2) h += `<div class="abs" style="left:${Math.round(fromX)}px;top:${y - 6}px;width:${Math.round(tX - fromX)}px;height:12px;background:#fff;box-shadow:0 0 14px 3px ${c}"></div>`;
  if (running) {
    const start = tX - fromX > 40 ? fromX : xs[Math.min(l.at, n - 1)];
    const len = Math.round(tX - start - 18);
    if (len > 24) h += `<div class="abs pulse" style="--len:${len}px;left:${Math.round(start - 6)}px;top:${y - 6}px;width:12px;height:12px;border-radius:6px;background:#fff;box-shadow:0 0 14px 4px ${c}"></div>`;
  }
  l.stations.forEach((name, k) => {
    const done = k <= l.at, next = k === l.at + 1, first = k === 0, last = k === n - 1;
    const d = next ? 24 : (done ? 18 : 16);
    const bd = done ? `3px solid ${G}` : (next ? `5px solid ${c}` : `3px solid ${c}99`);
    h += `<div class="abs${next && running ? ' ringy' : ''}" style="left:${Math.round(xs[k] - d / 2)}px;top:${Math.round(y - d / 2)}px;width:${d}px;height:${d}px;border-radius:50%;box-sizing:border-box;background:${done ? '#fff' : G};border:${bd}"></div>`;
    const lx = first ? xs[k] - 10 : (last ? xs[k] - 190 : xs[k] - 100);
    h += `<span class="abs" style="left:${Math.round(lx)}px;top:${y - (next ? 42 : 36)}px;width:200px;text-align:${first ? 'left' : (last ? 'right' : 'center')};font-size:${next ? 18 : 14}px;font-weight:${next ? 800 : 600};color:${next ? '#fff' : (done ? '#dfe6f5' : '#a9b8d8')};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</span>`;
  });
  if (held && l.at < n - 1) h += `<div class="abs" style="left:${Math.round(xs[l.at + 1] - 46)}px;top:${y - 12}px;width:24px;height:24px;border-radius:12px;background:#ff4d4d;border:5px solid #fff;box-sizing:border-box;box-shadow:0 4px 10px rgba(0,0,0,.4)"></div>`;
  const tc = parked ? '#6d7ea3' : '#fff';
  const tsh = running ? `0 0 0 4px ${c}88, 0 6px 14px rgba(0,0,0,.45)` : '0 4px 10px rgba(0,0,0,.4)';
  h += `<div class="abs" style="left:${Math.round(tX - 18)}px;top:${y - 9}px;width:36px;height:18px;border-radius:9px;background:${tc};box-shadow:${tsh};font-size:12px;font-weight:800;color:${G};display:flex;align-items:center;justify-content:center">${parked ? 'P' : ''}</div>`;
  const needs = Array.isArray(l.needs) ? l.needs : [];
  let status, sub, stc;
  if (held) { status = 'Held ' + daysSince(l.held && l.held.since) + ' days'; sub = (l.held && l.held.reason) || l.task || ''; stc = '#ff8a80'; }
  else if (parked) { status = 'Parked · ' + ago(l.lastPush); sub = l.task || ''; stc = '#a9b8d8'; }
  else if (running) { status = 'Agent working · ' + ago(l.lastPush); sub = l.task || ''; stc = '#fff'; }
  else { status = 'Moving · last push ' + ago(l.lastPush); sub = l.task || ''; stc = '#dfe6f5'; }
  h += `<div class="abs" style="left:1592px;top:${y - 22}px;width:290px;display:flex;flex-direction:column;gap:1px"><span style="font-size:20px;font-weight:800;color:${stc};white-space:nowrap;display:flex;align-items:center;gap:10px">${esc(status)}</span><span style="font-size:16px;font-weight:600;color:#a9b8d8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(sub)}</span></div>`;
  return h;
}

function lowerHtml(lines) {
  const running = lines.filter(l => l.state === 'moving' && l.lastPush && (Date.now() - Date.parse(l.lastPush) < RUN_MS));
  let rows = running.slice(0, 5).map((l, i) => `<div style="height:36px;margin-bottom:4px;display:flex;align-items:center;gap:20px;padding:0 16px;background:#0a1530;border-radius:4px;position:relative;font-size:18px;font-weight:600" class="mono row" data-line="${esc(l.id)}"><span class="abs" style="left:0;right:0;top:18px;height:1px;background:#1b2a54;z-index:0"></span><span style="width:12px;height:12px;border-radius:3px;background:${l.color};flex:none"></span><span style="width:200px;flex:none;letter-spacing:.5px">${esc(l.name.toUpperCase())}</span><span style="flex:1;color:#dfe6f5;font-family:Overpass,sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(l.task || '')}</span><span class="flap" style="animation-delay:${(i * 1.8).toFixed(1)}s;color:#f4c430;flex:none">${esc(ago(l.lastPush).toUpperCase())}</span></div>`).join('');
  if (!rows) {
    const latest = lines.filter(l => l.lastPush).sort((a, b) => b.lastPush.localeCompare(a.lastPush))[0];
    rows = `<p style="margin:6px 0 0;font-size:20px;color:#a9b8d8">No agent is working right now.${latest ? ' Last push: ' + esc(latest.name) + ', ' + esc(ago(latest.lastPush)) + '.' : ''}</p>`;
  }
  const depot = (state.depot || []).slice(0, 14).map(d => `<span style="display:flex;align-items:center;gap:12px;font-size:16px;color:#b8c5e3;white-space:nowrap;overflow:hidden"><span style="width:26px;height:6px;border-radius:3px;background:#3a4a74;flex:none"></span>${esc(d.name)}</span>`).join('');
  return `<div class="abs" style="left:48px;right:48px;top:760px;height:1px;background:#24376b"></div>
<section class="abs" style="left:48px;top:778px;width:1300px"><h2 style="margin:0 0 10px;font-size:20px;font-weight:800">Running now</h2>${rows}</section>
<section class="abs" style="left:1400px;top:778px;width:472px"><h2 style="margin:0 0 12px;font-size:20px;font-weight:800">In the depot <span style="font-weight:600;color:#a9b8d8;font-size:16px">not moving</span></h2><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:24px;row-gap:10px">${depot}</div></section>`;
}

function showArrival(l) {
  const el = document.getElementById('arrival');
  const n = l.stations.length;
  const at = Math.min(l.at, n - 1);
  const station = l.stations[at];
  const next = l.stations[at + 1];
  const final = at >= n - 1;
  const idx = (state.lines || []).findIndex(x => x.id === l.id) + 1;
  const time = new Date().toLocaleTimeString('de-CH', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Zurich' });
  const signSize = Math.min(150, Math.floor(1560 / Math.max(6, station.length * 0.56)));
  const RX0 = 200, RX1 = 1720;
  const xs = l.stations.map((_, k) => RX0 + (n > 1 ? k / (n - 1) : 0) * (RX1 - RX0));
  const prevX = at > 0 ? xs[at - 1] : xs[at] - 160;
  let route = `<div class="abs" style="left:${RX0}px;top:710px;width:${Math.round(xs[at] - RX0)}px;height:20px;border-radius:10px 0 0 10px;background:${G}"></div>`;
  if (!final) route += `<div class="abs" style="left:${Math.round(xs[at])}px;top:710px;width:${Math.round(RX1 - xs[at])}px;height:20px;border-radius:0 10px 10px 0;background:rgba(16,31,68,.25)"></div>`;
  l.stations.forEach((name, k) => {
    const done = k < at, here = k === at;
    const d = here ? 60 : 34;
    route += `<div class="abs${here ? ' arrive-ring' : ''}" style="left:${Math.round(xs[k] - d / 2)}px;top:${Math.round(720 - d / 2)}px;width:${d}px;height:${d}px;border-radius:50%;box-sizing:border-box;background:${done || here ? '#fff' : l.color};border:${here ? 9 : 6}px solid ${G};opacity:${done || here ? 1 : .55}"></div>`;
    const first = k === 0, last = k === n - 1;
    const lx = first ? xs[k] - 20 : (last ? xs[k] - 240 : xs[k] - 130);
    route += `<span class="abs" style="left:${Math.round(lx)}px;top:${here ? 768 : 754}px;width:${first || last ? 260 : 260}px;text-align:${first ? 'left' : (last ? 'right' : 'center')};font-size:${here ? 30 : 22}px;font-weight:${here ? 800 : 700};color:${G};opacity:${done || here ? 1 : .6};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</span>`;
  });
  route += `<div class="abs arrive-train" style="--from:${Math.round(prevX - xs[at])}px;left:${Math.round(xs[at] - 132)}px;top:694px;width:100px;height:52px;border-radius:26px;background:#fff;box-shadow:0 10px 24px rgba(16,31,68,.35)"></div>`;
  el.style.background = l.color;
  el.innerHTML = `<div class="abs" style="left:64px;top:52px;right:64px;display:flex;justify-content:space-between;align-items:center">
<span style="display:flex;align-items:center;gap:16px;background:${G};color:${l.color};font-size:40px;font-weight:800;padding:10px 26px 6px;border-radius:12px;line-height:1"><span style="width:44px;height:44px;border-radius:22px;background:${l.color};color:${G};font-size:26px;display:flex;align-items:center;justify-content:center;margin-top:-4px">${idx || ''}</span>${esc(l.name)}</span>
<span class="mono" style="font-size:44px;font-weight:600">${time}</span></div>
<div class="abs" style="left:0;right:0;top:230px;display:flex;flex-direction:column;align-items:center;gap:26px">
<span style="font-size:40px;font-weight:800">${final ? 'End of the line' : 'Arrived at station ' + (at + 1) + ' of ' + n}</span>
<div class="arrive-sign" style="background:#1a3170;border-radius:22px;padding:12px;box-shadow:0 28px 60px rgba(16,31,68,.4)"><div style="border:4px solid #fff;border-radius:14px;padding:26px 88px 16px;display:flex;flex-direction:column;align-items:center;gap:6px">
<span style="display:block;color:#fff;font-size:${signSize}px;font-weight:800;letter-spacing:-2px;line-height:1;white-space:nowrap">${esc(station)}</span>
${final ? '<span style="color:#c9d4ee;font-size:30px;font-weight:700;letter-spacing:6px">TERMINUS</span>' : ''}
</div></div></div>
<div role="img" aria-label="${esc(l.name)} line: ${at + 1} of ${n} stations reached">${route}</div>
<div class="abs" style="left:64px;right:64px;top:870px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:64px">
<div style="display:flex;flex-direction:column;gap:6px"><span style="font-size:20px;font-weight:700;opacity:.75">${final ? 'Last work on this line' : 'The agent works on'}</span><span style="font-size:32px;font-weight:800;line-height:1.15">${esc(l.task || '')}</span></div>
<div style="display:flex;flex-direction:column;gap:6px;text-align:right"><span style="font-size:20px;font-weight:700;opacity:.75">${final ? 'All stations reached' : 'Next station'}</span><span style="font-size:32px;font-weight:800;line-height:1.15">${final ? n + ' of ' + n : esc(next)}</span></div>
</div>
<div class="abs" style="left:0;right:0;bottom:0;height:8px;background:rgba(16,31,68,.15)"><div class="drain" style="height:8px;background:${G}"></div></div>`;
  el.classList.add('on');
  clearTimeout(arrivalTimer);
  arrivalTimer = setTimeout(() => el.classList.remove('on'), 20000);
}


// ---------- Line detail: the whole route with every step ----------
const DETAIL_MS = 120000, AMBER = '#ffb347';
let viewIdx = -1, viewTimer = null, cycleStarted = false;

// The station the train is heading to.
function targetStation(l) {
  const n = l.stations.length;
  if (l.at === 0 && l.progress === 0 && l.steps[0].some(x => !x.done)) return 0;
  return Math.min(l.at + 1, n - 1);
}

function detailHtml(l) {
  const n = l.stations.length, c = l.color, fut = c + '45';
  const idx = (state.lines || []).findIndex(x => x.id === l.id) + 1;
  const tgt = targetStation(l);
  const finished = l.steps.every(st => st.every(x => x.done));
  const nowStep = finished ? null : (l.steps[tgt].find(x => !x.done) || l.steps.flat().find(x => !x.done));
  // Timetable grid: one column per station; the station's node sits at the head of its column.
  // Done stations fold into narrow columns; the open ones get the room, because the path ahead matters most.
  const CL = 56, CR = 1864, GAP = 28, RY = 372;
  const isDone = l.steps.map(st => st.length > 0 && st.every(x => x.done));
  const nDone = isDone.filter(Boolean).length, nOpen = n - nDone;
  const avail = CR - CL - GAP * (n - 1);
  let openW = nOpen ? Math.min(560, (avail - 170 * nDone) / nOpen) : 0;
  let doneW = nDone ? Math.max(150, Math.min(300, (avail - openW * nOpen) / nDone)) : 0;
  if (!nOpen) doneW = avail / n;
  const widths = isDone.map(d => Math.round(d ? doneW : openW));
  const colX = k => CL + widths.slice(0, k).reduce((a, w) => a + w + GAP, 0);
  const colW = Math.round(openW);
  const many = Math.max(...l.steps.map((st, k) => isDone[k] ? 0 : st.length)) > 8;
  const xs = l.stations.map((_, k) => colX(k) + 10);
  const RX0 = xs[0], RX1 = xs[n - 1];
  const posX = (at, p) => at >= n - 1 ? xs[n - 1] : xs[at] + p * (xs[at + 1] - xs[at]);
  const tX = finished ? xs[n - 1] : posX(l.at, l.progress);
  const tf = l.todayFrom || { at: l.at, progress: l.progress };
  const fromX = Math.min(posX(tf.at, tf.progress), tX);
  const held = l.state === 'held', parked = l.state === 'parked';
  const running = l.state === 'moving' && l.lastPush && (Date.now() - Date.parse(l.lastPush) < RUN_MS);
  const left = l.steps.flat().filter(x => !x.done).length;
  let status, stc;
  if (held) { status = 'Held ' + daysSince(l.held && l.held.since) + ' days · ' + ((l.held && l.held.reason) || ''); stc = '#ff8a80'; }
  else if (parked) { status = 'Parked · last push ' + ago(l.lastPush); stc = '#a9b8d8'; }
  else if (running) { status = 'Agent working · ' + ago(l.lastPush); stc = '#fff'; }
  else { status = 'Moving · last push ' + ago(l.lastPush); stc = '#dfe6f5'; }

  let h = '';
  // header
  h += `<div class="abs" style="left:56px;top:44px;right:56px;display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;align-items:center;gap:28px"><span style="display:flex;align-items:center;gap:14px;background:${c};color:${G};font-size:40px;font-weight:800;padding:10px 24px 6px;border-radius:12px;line-height:1"><span style="width:42px;height:42px;border-radius:21px;background:${G};color:${c};font-size:24px;display:flex;align-items:center;justify-content:center;margin-top:-4px">${idx || ''}</span>${esc(l.name)}</span>
<span style="font-size:24px;font-weight:800;color:${stc};white-space:nowrap">${esc(status)}</span></div>
<div style="display:flex;align-items:center;gap:14px"><button class="navbtn" data-nav="prev" aria-label="Previous line">‹</button><button class="navbtn" data-nav="next" aria-label="Next line">›</button><button class="navbtn" data-nav="map">Map</button></div></div>`;
  // goal + totals
  h += `<div class="abs" style="left:64px;top:168px;width:1340px;display:flex;flex-direction:column;gap:10px">
<span class="mono" style="font-size:16px;font-weight:600;letter-spacing:3px;color:${c}">DESTINATION</span>
<span class="clamp2" style="font-size:48px;font-weight:800;line-height:1.12;letter-spacing:-.5px">${esc(l.goal || l.stations[n - 1])}</span></div>
<div class="abs" style="left:1460px;top:168px;width:400px;display:flex;flex-direction:column;align-items:flex-end;gap:4px">
<span style="font-size:64px;font-weight:800;line-height:1">${l.stepsDone}<span style="color:#6d7ea3"> / ${l.stepsTotal}</span></span>
<span style="font-size:20px;font-weight:700;color:#a9b8d8">steps done · ${finished ? 'all stations reached' : 'heading to station ' + (tgt + 1) + ' of ' + n}</span></div>`;
  // target column panel
  if (!finished) {
    h += `<div class="abs" style="left:${colX(tgt) - 16}px;top:334px;width:${widths[tgt] + 32}px;height:588px;border-radius:16px;background:rgba(255,255,255,.055);border:1px solid ${c}55"></div>`;
  }
  // route
  h += `<div class="abs" style="left:${RX0}px;top:${RY - 7}px;width:${Math.round(tX - RX0)}px;height:14px;border-radius:7px 0 0 7px;background:${c}"></div>`;
  h += `<div class="abs" style="left:${Math.round(tX)}px;top:${RY - 7}px;width:${Math.round(RX1 - tX)}px;height:14px;border-radius:0 7px 7px 0;background:${fut}"></div>`;
  if (tX - fromX > 2) h += `<div class="abs" style="left:${Math.round(fromX)}px;top:${RY - 7}px;width:${Math.round(tX - fromX)}px;height:14px;background:#fff;box-shadow:0 0 16px 3px ${c}"></div>`;
  l.stations.forEach((name, k) => {
    const st = l.steps[k] || [];
    const sd = st.filter(x => x.done).length;
    const done = st.length && sd === st.length, here = k === tgt && !finished;
    const term = k === n - 1;
    const d = here ? 30 : (term ? 30 : 22);
    const bd = done ? `4px solid ${G}` : (here ? `6px solid ${c}` : `4px solid ${c}99`);
    h += `<div class="abs" style="left:${Math.round(xs[k] - d / 2)}px;top:${Math.round(RY - d / 2)}px;width:${d}px;height:${d}px;border-radius:50%;box-sizing:border-box;background:${done ? '#fff' : G};border:${bd}"></div>`;
    if (term && !done) h += `<div class="abs" style="left:${Math.round(xs[k] - 5)}px;top:${RY - 5}px;width:10px;height:10px;border-radius:5px;background:${c}"></div>`;
    const cx = colX(k), w = widths[k];
    if (isDone[k]) {
      h += `<div class="abs" style="left:${cx}px;top:402px;width:${w}px;display:flex;flex-direction:column;gap:10px">
<span class="clamp2" style="font-size:21px;line-height:1.2;font-weight:800;color:#dfe6f5">${esc(name)}</span>
<span style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700;color:#a9b8d8"><span style="width:20px;height:20px;border-radius:10px;background:${c};color:${G};font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none">✓</span>${st.length} steps done</span></div>`;
      return;
    }
    h += `<div class="abs" style="left:${cx}px;top:402px;width:${w}px;display:flex;justify-content:space-between;align-items:baseline;gap:8px">
<span style="font-size:${here ? 26 : 23}px;font-weight:800;color:${here || done ? '#fff' : '#a9b8d8'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(name)}</span>
<span class="mono" style="font-size:14px;font-weight:600;color:${done ? c : '#8b9bc2'};flex:none">${done ? 'DONE' : sd + '/' + st.length}</span></div>`;
    const rows = st.map(x => {
      const isNow = x === nowStep;
      const icon = x.done
        ? `<span style="width:20px;height:20px;border-radius:10px;background:${c};color:${G};font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:3px">✓</span>`
        : (isNow ? `<span class="nowdot" style="width:20px;height:20px;border-radius:10px;background:#fff;flex:none;margin-top:3px"></span>`
                 : `<span style="width:20px;height:20px;border-radius:10px;box-sizing:border-box;border:3px solid #4a5b85;flex:none;margin-top:3px"></span>`);
      const col = x.done ? '#c9d4ee' : (isNow ? '#fff' : '#8b9bc2');
      return `<div style="display:flex;gap:12px;align-items:flex-start${isNow ? ';background:' + c + '26;margin:0 -10px;padding:6px 10px;border-radius:8px' : ''}">${icon}<span class="clamp2" style="font-size:${many ? 19 : 21}px;line-height:1.25;font-weight:${isNow ? 800 : 600};color:${col}">${esc(x.t)}</span></div>`;
    }).join('');
    h += `<div class="abs" style="left:${cx}px;top:458px;width:${w}px;display:flex;flex-direction:column;gap:${many ? 9 : 14}px">${rows}</div>`;
  });
  const tc = parked ? '#6d7ea3' : '#fff';
  h += `<div class="abs" style="left:${Math.round(tX - 24)}px;top:${RY - 12}px;width:48px;height:24px;border-radius:12px;background:${tc};box-shadow:${running ? `0 0 0 5px ${c}88,` : ''}0 6px 14px rgba(0,0,0,.45);font-size:14px;font-weight:800;color:${G};display:flex;align-items:center;justify-content:center">${parked ? 'P' : ''}</div>`;
  if (held && !finished) h += `<div class="abs" style="left:${Math.round(xs[tgt] - 58)}px;top:${RY - 15}px;width:30px;height:30px;border-radius:15px;background:#ff4d4d;border:6px solid #fff;box-sizing:border-box"></div>`;
  // bottom strip
  const needs = Array.isArray(l.needs) ? l.needs : [];
  h += `<div class="abs" style="left:64px;right:64px;top:956px;display:grid;grid-template-columns:${needs.length ? 'minmax(0,1fr) minmax(0,1.2fr) auto' : 'repeat(2,minmax(0,1fr))'};gap:56px">
<div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:18px;font-weight:700;color:#a9b8d8">${held ? 'Waiting for' : (parked ? 'Last work on this line' : 'The agent works on')}</span><span style="font-size:28px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(held ? ((l.held && l.held.reason) || l.task) : l.task)}</span></div>
${needs.length ? `<div style="display:flex;flex-direction:column;gap:4px;min-width:0"><span style="font-size:18px;font-weight:700;color:${AMBER}">Needs you${needs.length > 1 ? ' · ' + needs.length + ' things' : ''}</span><span style="font-size:28px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(needs[0].t)}</span></div>` : ''}<div style="display:flex;flex-direction:column;gap:4px;text-align:right"><span style="font-size:18px;font-weight:700;color:#a9b8d8">${finished ? 'Destination reached' : 'Still to go'}</span><span style="font-size:28px;font-weight:800;white-space:nowrap">${finished ? 'All ' + n + ' stations' : left + (left === 1 ? ' open step' : ' open steps')}</span></div></div>
<div class="abs" style="left:0;right:0;bottom:0;height:6px;background:rgba(255,255,255,.06)"><div class="drain" style="height:6px;background:${c};animation-duration:${DETAIL_MS / 1000}s;opacity:.6"></div></div>`;
  return `<div role="img" aria-label="${esc(l.name)}: ${l.stepsDone} of ${l.stepsTotal} steps done towards ${esc(l.goal || '')}">${h}</div>`;
}

const detailLines = () => (state && state.lines || []).filter(l => Array.isArray(l.steps) && l.steps.length === l.stations.length);
let openId = null;

// A detail screen opens on a click and goes back to the map by itself after a while,
// so the wall always returns to the overview.
function showDetail(l) {
  const el = document.getElementById('detail');
  clearTimeout(viewTimer);
  if (!l) { el.classList.remove('on'); openId = null; return; }
  openId = l.id;
  el.innerHTML = detailHtml(l);
  el.classList.add('on');
  if (!Q.get('view')) viewTimer = setTimeout(() => showDetail(null), DETAIL_MS);
}

function step(dir) {
  const list = detailLines();
  if (!list.length) return;
  const i = list.findIndex(l => l.id === openId);
  showDetail(list[(i + dir + list.length) % list.length]);
}

document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { const d = nav.dataset.nav; d === 'map' ? showDetail(null) : step(d === 'next' ? 1 : -1); return; }
  if (e.target.closest('#arrival')) { document.getElementById('arrival').classList.remove('on'); return; }
  const hit = e.target.closest('[data-line]');
  if (hit) showDetail(detailLines().find(l => l.id === hit.dataset.line));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') showDetail(null);
  else if (openId && e.key === 'ArrowRight') step(1);
  else if (openId && e.key === 'ArrowLeft') step(-1);
  else if (!openId && e.key === 'Enter' && e.target.dataset && e.target.dataset.line) showDetail(detailLines().find(l => l.id === e.target.dataset.line));
});

async function load() {
  try {
    const res = await fetch(PREVIEW ? 'preview/' + encodeURIComponent(PREVIEW) + '.json' : '/state.json?key=' + encodeURIComponent(KEY), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const s = await res.json();
    const arrived = (s.lines || []).find(l => shown[l.id] !== undefined && l.at > shown[l.id]);
    state = s;
    (s.lines || []).forEach(l => { shown[l.id] = l.at; });
    render();
    if (!cycleStarted && Q.get('view')) { cycleStarted = true; showDetail(detailLines().find(l => l.id === Q.get('view'))); }
    else if (openId && !detailLines().some(x => x.id === openId)) showDetail(null);
    const forced = Q.get('arrive') && (s.lines || []).find(l => l.id === Q.get('arrive'));
    if (arrived || forced) showArrival(arrived || forced);
  } catch (e) {
    document.getElementById('fresh').textContent = 'offline, retrying';
  }
}
load();
setInterval(load, 30000);
setInterval(render, 60000);
})();
</script>
</body>
</html>
